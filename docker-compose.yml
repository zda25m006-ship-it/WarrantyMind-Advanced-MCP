version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: warrantymind-postgres
    environment:
      POSTGRES_USER: wm_user
      POSTGRES_PASSWORD: wm_password
      POSTGRES_DB: warrantymind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: warrantymind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: warrantymind-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wm_minio
      MINIO_ROOT_PASSWORD: wm_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  qdrantdata:
  miniodata:
